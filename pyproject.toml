[project]
name = "llm-agent-playbook"
version = "0.4.0"
description = "A programmable layer for unattended AI coding work: drive Claude Code, Codex, and Gemini CLIs from a YAML playbook with verify/repair loops, budgets, cross-agent fallback, and usage-window riding."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Glaxor" }]
keywords = ["claude-code", "codex", "gemini", "ai-agents", "automation",
            "playbook", "orchestration", "cli", "unattended"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6",
    "tzdata; platform_system == 'Windows'",   # zoneinfo has no system tz database on Windows
]

[project.urls]
Homepage = "https://github.com/Glaxor/agent-playbook"
Repository = "https://github.com/Glaxor/agent-playbook"
Issues = "https://github.com/Glaxor/agent-playbook/issues"

[project.scripts]
agent-playbook = "claude_runner:main"
claude-runner = "claude_runner:main"    # legacy alias

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["claude_runner"]
